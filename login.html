<!DOCTYPE html><html lang="ar" dir="rtl"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - وكالة ركن الأجور</title>
    <link rel="stylesheet" href="CSS/style.css">
</head><body><header>
    <h1>وكالة ركن الأجور للسفر والسياحة</h1>
    <p>رحلتك تبدأ معنا ❤️</p>
</header><nav>
    <a href="index.html">الرئيسية</a>
    <a href="services.html">خدماتنا</a>
    <a href="login.html">تسجيل الدخول</a>
    <a href="contact.html">تواصل معنا</a>
</nav><main><section>
    <h2>تسجيل الدخول 🔐</h2>

    <form onsubmit="event.preventDefault(); loginMessage();">

        <label for="username">اسم المستخدم:</label>
        <input type="text" id="username" placeholder="اسم المستخدم" required>

        <br><br>

        <label for="password">كلمة المرور:</label>
        <input type="password" id="password" placeholder="كلمة المرور" required>

        <br><br>

        <button type="submit">دخول</button>
        <button type="reset">مسح الحقول</button>

    </form>
  <p>ليس لديك حساب؟
    <a href="#" onclick="showRegister(); return false;">إنشاء حساب جديد</a>
</p><div id="registerBox" style="display:none;">
    <h2>إنشاء حساب جديد ❤️</h2><form id="registerForm">
    <label>الاسم الكامل:</label><br>
    <input type="text" id="fullName" required><br><br>

    <label>اسم المستخدم:</label><br>
    <input type="text" id="newUsername" required><br><br>

    <label>البريد الإلكتروني:</label><br>
    <input type="email" id="newEmail" required><br><br>

    <label>كلمة المرور:</label><br>
    <input type="password" id="newPassword" required minlength="6"><br><br>

    <label>تأكيد كلمة المرور:</label><br>
    <input type="password" id="confirmPassword" required minlength="6"><br><br>

    <button type="submit">إنشاء الحساب</button>
</form>

</div><script>
function showRegister() {
    document.getElementById("registerBox").style.display = "block";
}

document.getElementById("registerForm").addEventListener("submit", function(event) {
    event.preventDefault();

    let password = document.getElementById("newPassword").value;
    let confirmPassword = document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {
        alert("كلمتا المرور غير متطابقتين!");
        return;
    }

    alert("تم التحقق من بيانات التسجيل بنجاح ❤️");
});
</script>
</section>

</main><footer>
    <p>وكالة ركن الأجور للسفر والسياحة</p>
    <p>جميع الحقوق محفوظة &copy; 2026</p>
</footer><script src="JS/script.js"></script></body>
                                   </html>

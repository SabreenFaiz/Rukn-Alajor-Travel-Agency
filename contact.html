<body>

    <header>
        <h1>تواصل معنا</h1>
        <p>يسعدنا استقبال استفساراتكم</p>
    </header>

    <nav>
        <a href="index.html">الرئيسية</a>

    <main>

        <section>
            <h2>بيانات الوكالة</h2>

            <p>اسم الوكالة: وكالة ركن الأجور للسفر والسياحة.</p>

            <p>الموقع: ود مدني، بالقرب من بنك الخرطوم.</p>
        </section>

        <section>
            <h2>أرسل رسالة</h2>

            <form action="#" method="post">

                <label for="name">الاسم:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">البريد الإلكتروني:</label>
                <input type="email" id="email" name="email" required>

                <label for="subject">الموضوع:</label>
                <input type="text" id="subject" name="subject" required>

                <label for="message">الرسالة:</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <button type="submit">إرسال الرسالة</button>

            </form>
        </section>

    </main>

    <footer>
        <p>وكالة ركن الأجور للسفر والسياحة</p>
        <p>جميع الحقوق محفوظة &copy; 2026</p>
    </footer>

</body>
